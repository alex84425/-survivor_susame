<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修仙百科</title>
<style>
  :root { --bg: #0b0d12; --panel: #12151c; --panel2: #181c25; --line: #2c2a22; --gold: #ffd98a; --text: #e8e4d8; --muted: #9c968a; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; color: var(--gold); letter-spacing: 4px; }
  header a { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.on { color: var(--gold); border-color: #6b5a2e; background: rgba(255, 217, 138, .06); }
  main { padding: 16px 20px 40px; max-width: 1240px; margin: 0 auto; }
  section { display: none; } section.on { display: block; }
  h2 { color: var(--gold); font-size: 17px; margin: 22px 0 8px; }
  h3 { font-size: 15px; margin: 14px 0 6px; }
  p, li { line-height: 1.7; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  table { border-collapse: collapse; margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  th { background: var(--panel2); color: var(--muted); font-weight: normal; }
  td.num, th.num { text-align: right; }
  .wrap { overflow-x: auto; }
  .formula { display: block; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; margin: 6px 0; white-space: pre-wrap; font-family: Consolas, monospace; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid; border-radius: 8px; padding: 10px 14px; }
  .card h3 { margin: 2px 0 6px; font-size: 18px; }
  .card img { width: 88px; height: 88px; image-rendering: pixelated; float: right; }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; font-size: 12px; margin: 2px 2px 0 0; color: var(--muted); }
  .move { font-size: 13px; margin: 3px 0; }
  .band { display: inline-block; width: 22px; color: var(--gold); }
  @media (max-width: 700px) { main { padding: 12px 16px 32px; } }
</style>
</head>
<body>
<header>
  <h1>修仙百科</h1>
  <nav id="tabs">
    <button data-t="cls" class="on">職業</button>
    <button data-t="skill">戰技</button>
    <button data-t="boon">心法</button>
    <button data-t="enemy">妖獸</button>
    <button data-t="rule">規則與公式</button>
  </nav>
  <a href="index.html">← 回到遊戲</a>
  <a href="wiki-legacy.html">舊版百科</a>
</header>
<main>
  <section id="cls" class="on"></section>
  <section id="skill"></section>
  <section id="boon"></section>
  <section id="enemy"></section>
  <section id="rule"></section>
</main>
<script type="module" src="src/v3/wiki3.js"></script>
</body>
</html>
