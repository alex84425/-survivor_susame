<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修仙百科</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel2: #181c25; --line: #2c2a22; --gold: #ffd98a;
    --text: #e8e4d8; --muted: #9c968a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; color: var(--gold); letter-spacing: 4px; }
  header a { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.on { color: var(--gold); border-color: #6b5a2e; background: rgba(255, 217, 138, .06); }
  main { padding: 16px 20px 40px; max-width: 1280px; margin: 0 auto; }
  section { display: none; }
  section.on { display: block; }
  h2 { color: var(--gold); font-size: 17px; margin: 22px 0 8px; }
  h3 { font-size: 15px; margin: 16px 0 6px; }
  p, li { line-height: 1.7; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  table { border-collapse: collapse; margin: 6px 0 12px; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); padding: 4px 10px; text-align: right; }
  th { background: var(--panel2); color: var(--muted); font-weight: normal; }
  td:first-child, th:first-child { text-align: left; }
  .wrap { overflow-x: auto; }
  code, .formula { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font-family: Consolas, monospace; }
  .formula { display: block; padding: 8px 12px; margin: 6px 0; white-space: pre-wrap; }

  /* 神通 */
  .skills { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  .slist button { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 7px 10px; margin-bottom: 4px; border-radius: 6px; cursor: pointer; font: inherit; }
  .slist button.on { border-color: var(--gold); }
  .slist .k { color: var(--muted); font-size: 12px; float: right; }
  .detail { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .ctl { display: grid; grid-template-columns: 76px 1fr 46px; align-items: center; gap: 6px; margin: 4px 0; }
  .ctl input[type=range] { width: 100%; accent-color: #c9a75a; }
  .ctl output { text-align: right; font-variant-numeric: tabular-nums; }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stats b { color: var(--gold); font-weight: normal; }
  .preview { position: relative; }
  .preview iframe { width: 100%; height: 360px; border: 1px solid var(--line); border-radius: 8px; background: #000; display: block; }
  .dps { position: absolute; top: 8px; left: 10px; background: rgba(0, 0, 0, .7); padding: 4px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .dps b { color: var(--gold); font-size: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }

  /* 妖獸 */
  .beasts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .beast { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .beast img { width: 96px; height: 96px; image-rendering: pixelated; float: left; margin-right: 8px; }
  .beast h3 { margin: 2px 0 4px; }
  .beast table { clear: both; width: 100%; font-size: 12px; }
  .beast th, .beast td { padding: 2px 5px; white-space: nowrap; }
  html, body { overflow-x: hidden; }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; font-size: 12px; margin: 2px 2px 0 0; color: var(--muted); }

  /* 圖表 */
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; }
  .tip { position: absolute; pointer-events: none; background: #1a1a19; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; display: none; white-space: nowrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .build { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }

  @media (max-width: 860px) {
    .skills, .detail { grid-template-columns: 1fr; }
    main { padding: 12px 16px 32px; }
  }
</style>
</head>
<body>
<header>
  <h1>修仙百科</h1>
  <nav id="tabs">
    <button data-t="skills" class="on">神通</button>
    <button data-t="gongfa">功法</button>
    <button data-t="formula">合成與公式</button>
    <button data-t="beasts">妖獸</button>
    <button data-t="balance">數值平衡</button>
  </nav>
  <a href="index.html">← 回到遊戲</a>　<span class="muted small">（百科目前對應舊版數值，第三階段會更新）</span>
</header>
<main>
  <section id="skills" class="on">
    <div class="skills">
      <div class="slist" id="slist"></div>
      <div>
        <div class="detail">
          <div class="card" id="scard"></div>
          <div class="preview">
            <iframe id="sbx" src="legacy.html?sandbox=1" title="神通預覽"></iframe>
            <div class="dps">打木樁實測 <b id="dps">—</b> 傷害/秒</div>
            <div class="row">
              <label>木樁 <select id="dcount"><option value="1">1 支</option><option value="5">5 支（群體）</option><option value="12">12 支（群體）</option></select></label>
              <label>木樁屬性 <select id="delem"></select></label>
              <span class="muted small" id="dnote"></span>
            </div>
          </div>
        </div>
        <h3>各品階 × 等級的單發傷害</h3>
        <p class="muted small">以下用目前設定的靈氣、境界計算；不含五行相剋。群體傷害請看打木樁實測（選 5 或 12 支）。</p>
        <div class="wrap" id="gtable"></div>
      </div>
    </div>
  </section>

  <section id="gongfa"></section>
  <section id="formula"></section>
  <section id="beasts"></section>
  <section id="balance"></section>
</main>
<script type="module" src="src/wiki.js"></script>
</body>
</html>
